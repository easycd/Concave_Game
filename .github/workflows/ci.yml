name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm test
      - name: build (서버와 같은 /omok 경로)
        run: npm run build
        env:
          BASE_PATH: /omok
