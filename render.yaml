services:
  - type: web
    name: omok-sai
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: omok-sai-db
          property: connectionString

databases:
  - name: omok-sai-db
    plan: free
    region: singapore
    databaseName: omok_sai
